<!doctype html>
<html lang="en-US">
    <head>
        <meta charset="utf-8" />
        <link rel="stylesheet" href="popup.css" />
    </head>

    <body>
        <div id="popup-content">
            <label id="shade-level-label" for="shade-level"
                >Shade level: <span id="shade-level-value">0%</span></label
            >
            <input
                type="range"
                id="shade-level"
                min="0"
                max="100"
                step="1"
                value="0"
            />
        </div>
        <div id="error-content" class="hidden">
            <p>Can't shade this web page.</p>
            <p>Try a different page.</p>
        </div>
        <script src="popup.js"></script>
    </body>
</html>

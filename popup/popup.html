<!doctype html>
<html lang="en-US">
    <head>
        <meta charset="utf-8" />
        <link rel="stylesheet" href="popup.css" />
    </head>

    <body>
        <div id="popup-content">
            <section id="default-section">
                <label class="switch-row">
                    <input type="checkbox" id="shade-by-default" />
                    <span>Shade by default</span>
                </label>
                <label id="default-level-label" for="default-level"
                    >Default level:
                    <span id="default-level-value">0%</span></label
                >
                <input
                    type="range"
                    id="default-level"
                    min="0"
                    max="100"
                    step="1"
                    value="0"
                />
                <label class="switch-row sub-option">
                    <input type="checkbox" id="skip-dark-sites" />
                    <span>Ignore dark sites (experimental)</span>
                </label>
                <p id="dark-detected-hint" class="hint hidden">
                    This page looks dark already.
                </p>
            </section>

            <section id="site-section">
                <label id="site-level-label" for="site-level"
                    >This site's level:
                    <span id="site-level-value">0%</span></label
                >
                <input
                    type="range"
                    id="site-level"
                    min="0"
                    max="100"
                    step="1"
                    value="0"
                />
                <label class="switch-row sub-option">
                    <input type="checkbox" id="save-site" />
                    <span>Save this site's shade level</span>
                </label>
            </section>
        </div>

        <div id="error-content" class="hidden">
            <p>Can't shade this web page.</p>
            <p>Try a different page.</p>
        </div>

        <div id="preferences-row">
            <button type="button" id="open-preferences">Preferences</button>
        </div>

        <footer id="shortcut-hint">
            <div>Alt+Shift+↑ more dim · Alt+Shift+↓ less dim</div>
            <div>Alt+Shift+D toggle</div>
            <div id="shortcut-rebind">
                Rebind in about:addons → ⚙ → Manage Extension Shortcuts
            </div>
        </footer>
        <script src="popup.js"></script>
    </body>
</html>
